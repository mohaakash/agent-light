name: Build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - run: npm run lint
      - run: npm run test:integrations
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: windows
            bundles: msi,nsis
            artifact: AgentLight-Windows
          - platform: macos-latest
            target: macos
            bundles: dmg,app
            artifact: AgentLight-macOS
          - platform: ubuntu-22.04
            target: linux
            bundles: deb,appimage
            artifact: AgentLight-Linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - run: npm ci
      - name: Set release version
        shell: bash
        run: |
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          VERSION="$VERSION" node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const version = process.env.VERSION;
            const cargoPath = "src-tauri/Cargo.toml";
            const cargo = readFileSync(cargoPath, "utf8").replace(/^version = "[^"]+"/m, `version = "${version}"`);
            writeFileSync(cargoPath, cargo);
            const tauriPath = "src-tauri/tauri.conf.json";
            const tauri = JSON.parse(readFileSync(tauriPath, "utf8"));
            tauri.version = version;
            writeFileSync(tauriPath, JSON.stringify(tauri, null, 2));
          '
      - name: Build application bundles
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/**
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false
      - name: Create version tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.1.${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            test "$(git rev-list -n 1 "$tag")" = "$COMMIT"
          else
            git tag "$tag" "$COMMIT"
            git push origin "refs/tags/$tag"
          fi
          if ! gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$REPOSITORY" \
              --title "AgentLight v$VERSION" \
              --generate-notes
          fi
          for platform in Windows macOS Linux; do
            if ! find "release-assets/AgentLight-$platform" -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -print -quit | grep -q .; then
              echo "No installer found for $platform" >&2
              exit 1
            fi
          done
          find release-assets -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -print0 | \
            xargs -0 -r gh release upload "$tag" --repo "$REPOSITORY" --clobber
